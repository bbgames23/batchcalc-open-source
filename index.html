'use strict';

/* ============================================
   CONSTANTS
   ============================================ */
const STORAGE_PREFIX = 'bbcalc_';
const TRANSITION_MS = 200;
const TOAST_DURATION = 2500;
const MAX_HISTORY = 100;
const FACTORIAL_LIMIT = 170;          // 170! is the largest finite double
const RESULT_PRECISION = 12;          // Significant figures for clean display
const FLOAT_EPSILON = 1e-10;          // For "near-zero" cleanup after trig

/* ============================================
   [1] STATE — single source of truth, merge + notify
   ============================================ */
const State = {
    data: {},
    listeners: [],
    init(initial) { this.data = { ...initial }; },
    get(key) { return key ? this.data[key] : this.data; },
    set(partial) {
        Object.assign(this.data, partial);
        for (const fn of this.listeners) fn(this.data);
    },
    onChange(fn) { this.listeners.push(fn); }
};

/* ============================================
   [4] ROUTER — hash-based, works from file://
   ============================================ */
const Router = {
    routes: {},
    current: '',
    init(routes, fallback) {
        this.routes = routes;
        this.fallback = fallback || Object.keys(routes)[0];
        window.addEventListener('hashchange', () => this.resolve());
        this.resolve();
    },
    resolve() {
        const hash = location.hash.slice(1) || this.fallback;
        this.current = hash;
        // Mark body BEFORE rendering so the mobile calc rules (hide tagline,
        // shrink title) apply to the first paint. Setting it after viewFn()
        // caused a visible reflow on load.
        document.body.classList.toggle('is-calc', hash === '/calc');
        const viewFn = this.routes[hash] || this.routes[this.fallback];
        if (viewFn) viewFn();
        renderNav();
    },
    navigate(path) { location.hash = path; },
    getCurrent() { return this.current; }
};

/* ============================================
   [5] STORE — JSON wrapper round localStorage
   ============================================ */
const Store = {
    prefix: STORAGE_PREFIX,
    get(key, fallback = null) {
        try {
            const raw = localStorage.getItem(this.prefix + key);
            return raw !== null ? JSON.parse(raw) : fallback;
        } catch { return fallback; }
    },
    set(key, value) {
        try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); }
        catch { /* private mode or quota — fail silently */ }
    },
    remove(key) { localStorage.removeItem(this.prefix + key); }
};

/* ============================================
   DOM HELPERS
   ============================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function html(el, template) {
    if (typeof el === 'string') el = $(el);
    if (!el) return;
    el.innerHTML = template;
}
function esc(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
}
function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function t(key) {
    const lang = State.get('lang') || 'en';
    return (LANGUAGES[lang] && LANGUAGES[lang][key]) || LANGUAGES.en[key] || key;
}

function changeLanguage(lang) {
    State.set({ lang });
    Store.set('lang', lang);
    document.documentElement.lang = lang;
    Router.resolve();
    renderNav();
    populateLangSelect();
}

function populateLangSelect() {
    const sel = $('#lang-select');
    if (!sel) return;
    const current = State.get('lang') || 'en';
    sel.innerHTML = Object.entries(LANGUAGES)
        .map(([code, data]) =>
            `<option value="${code}" ${code === current ? 'selected' : ''}>${esc(data.name)}</option>`
        ).join('');
}

/* ============================================
   MATHS ENGINE — shunting-yard parser.

   Tokeniser → RPN (postfix) → evaluator.
   No eval(), no dependencies. Handles:
     - Numbers (with decimal points)
     - Operators: + - * / ^ %
     - Functions: sin, cos, tan, asin, acos, atan,
       sinh, cosh, tanh, log, ln, exp, sqrt, cbrt, abs
     - Postfix: ! (factorial)
     - Constants: pi, e
     - Parentheses
     - Implicit multiplication: 2pi, 3(4), (2)(3)
     - Unary minus
   ============================================ */

const FUNCTIONS = {
    // Trig — respects DEG/RAD setting
    sin: x => cleanFloat(Math.sin(angleIn(x))),
    cos: x => cleanFloat(Math.cos(angleIn(x))),
    tan: x => {
        // tan 90°, 270° … has no value; Math.tan gives 1.6e16 from rounding
        if (State.get('angleMode') === 'deg' && Math.abs(x % 180) === 90) throw new Error('tan undefined');
        return cleanFloat(Math.tan(angleIn(x)));
    },
    asin: x => angleOut(Math.asin(x)),
    acos: x => angleOut(Math.acos(x)),
    atan: x => angleOut(Math.atan(x)),
    // Hyperbolic — always natural radian-like, no DEG/RAD effect
    sinh: x => Math.sinh(x),
    cosh: x => Math.cosh(x),
    tanh: x => Math.tanh(x),
    asinh: x => Math.asinh(x),
    acosh: x => Math.acosh(x),
    atanh: x => Math.atanh(x),
    // Logs and exp
    log: x => { if (x <= 0) throw new Error('log of non-positive'); return Math.log10(x); },
    ln:  x => { if (x <= 0) throw new Error('ln of non-positive'); return Math.log(x); },
    exp: x => Math.exp(x),
    // Roots
    sqrt: x => { if (x < 0) throw new Error('sqrt of negative'); return Math.sqrt(x); },
    cbrt: x => Math.cbrt(x),
    abs: x => Math.abs(x)
};

const OPERATORS = {
    '+': { prec: 2, assoc: 'L', fn: (a, b) => a + b },
    '-': { prec: 2, assoc: 'L', fn: (a, b) => a - b },
    '*': { prec: 3, assoc: 'L', fn: (a, b) => a * b },
    '/': { prec: 3, assoc: 'L', fn: (a, b) => {
        if (b === 0) throw new Error('Divide by zero');
        return a / b;
    }},
    '%': { prec: 3, assoc: 'L', fn: (a, b) => {
        if (b === 0) throw new Error('Modulo by zero');
        return a % b;
    }},
    '^': { prec: 4, assoc: 'R', fn: (a, b) => Math.pow(a, b) },
    // Unary minus precedence below ^ so -2^2 = -(2^2) = -4 (standard maths convention).
    // Above */, so 2*-3 still works correctly via implicit grouping.
    'u-': { prec: 3.5, assoc: 'R', unary: true, fn: a => -a },
    // High-precedence unary minus, used only when '-' appears immediately after '^'.
    // Without this, `2^-3` parses as (2^)(-3) = NaN because ^ has higher precedence
    // than the regular unary minus and pops before its right operand exists.
    'u-h': { prec: 5, assoc: 'R', unary: true, fn: a => -a }
};

const CONSTANTS = { pi: Math.PI, e: Math.E };

// nCr and nPr handled as two-argument special functions
const SPECIAL_FNS_2 = {
    ncr: (n, r) => {
        if (n < 0 || r < 0 || !Number.isInteger(n) || !Number.isInteger(r)) {
            throw new Error('nCr needs non-negative integers');
        }
        if (r > n) return 0;
        return factorial(n) / (factorial(r) * factorial(n - r));
    },
    npr: (n, r) => {
        if (n < 0 || r < 0 || !Number.isInteger(n) || !Number.isInteger(r)) {
            throw new Error('nPr needs non-negative integers');
        }
        if (r > n) return 0;
        return factorial(n) / factorial(n - r);
    }
};

function angleIn(x) {
    return State.get('angleMode') === 'deg' ? x * Math.PI / 180 : x;
}
function angleOut(x) {
    return State.get('angleMode') === 'deg' ? x * 180 / Math.PI : x;
}

function factorial(n) {
    if (n < 0) throw new Error('Factorial of negative');
    if (!Number.isInteger(n)) throw new Error('Factorial needs an integer');
    if (n > FACTORIAL_LIMIT) throw new Error('Factorial too large');
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
}

// Strip floating-point noise: 1e-15 → 0, 0.30000000000000004 → 0.3
function cleanFloat(x) {
    if (!Number.isFinite(x)) return x;
    if (Math.abs(x) < FLOAT_EPSILON) return 0;
    // Round to RESULT_PRECISION significant figures
    const rounded = Number(x.toPrecision(RESULT_PRECISION));
    return rounded;
}

/* TOKENISE
   Input is the user's expression with display symbols
   like ×, ÷, π, √. Convert to canonical form first.
*/
function normalise(input) {
    return input
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/π/g, 'pi')
        .replace(/√\(/g, 'sqrt(')
        .replace(/∛\(/g, 'cbrt(')
        .replace(/\s+/g, '');
}

function tokenise(input) {
    const tokens = [];
    let i = 0;
    const src = normalise(input);

    while (i < src.length) {
        const ch = src[i];

        // Number (with decimal, scientific notation)
        if (/[0-9.]/.test(ch)) {
            let num = '';
            while (i < src.length && /[0-9.]/.test(src[i])) num += src[i++];
            // Scientific notation: 1e5, 2.5e-3
            if (src[i] === 'e' || src[i] === 'E') {
                // Confirm it's a number suffix not a constant — needs digit or sign next
                const next = src[i + 1];
                if (next === '+' || next === '-' || /[0-9]/.test(next)) {
                    num += src[i++];
                    if (src[i] === '+' || src[i] === '-') num += src[i++];
                    while (i < src.length && /[0-9]/.test(src[i])) num += src[i++];
                }
            }
            if (!/^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(num)) throw new Error(`Bad number: ${num}`);
            tokens.push({ type: 'num', value: parseFloat(num) });
            continue;
        }

        // Identifier (function or constant)
        if (/[a-z]/i.test(ch)) {
            let name = '';
            while (i < src.length && /[a-z]/i.test(src[i])) name += src[i++];
            name = name.toLowerCase();

            if (name in CONSTANTS) {
                tokens.push({ type: 'num', value: CONSTANTS[name] });
            } else if (name in FUNCTIONS) {
                tokens.push({ type: 'fn', name });
            } else if (name in SPECIAL_FNS_2) {
                tokens.push({ type: 'fn2', name });
            } else if (name === 'ans') {
                tokens.push({ type: 'num', value: State.get('lastAnswer') || 0 });
            } else {
                throw new Error(`Unknown: ${name}`);
            }
            continue;
        }

        // Operators and punctuation
        if (ch === '(' || ch === ')') {
            tokens.push({ type: ch === '(' ? 'lparen' : 'rparen' });
            i++;
            continue;
        }
        if (ch === ',') {
            tokens.push({ type: 'comma' });
            i++;
            continue;
        }
        if (ch === '!') {
            tokens.push({ type: 'fact' });
            i++;
            continue;
        }
        if (ch in OPERATORS) {
            tokens.push({ type: 'op', value: ch });
            i++;
            continue;
        }

        throw new Error(`Unexpected: ${ch}`);
    }

    // Insert implicit multiplications and convert unary minus
    return processImplicit(tokens);
}

// 2pi → 2 * pi, 3(4) → 3 * (4), (2)(3) → (2) * (3), -3 → unary minus
function processImplicit(tokens) {
    const out = [];
    for (let i = 0; i < tokens.length; i++) {
        const tok = tokens[i];
        const prev = out[out.length - 1];

        // Detect unary minus: at start, or after an operator, or after lparen/comma
        if (tok.type === 'op' && tok.value === '-') {
            if (!prev || prev.type === 'op' || prev.type === 'lparen' || prev.type === 'comma') {
                // After '^' the unary minus must bind tighter than '^' itself,
                // otherwise `2^-3` collapses to NaN. Otherwise use the standard
                // low-precedence unary minus so `-2^2 = -4` (mathematical convention).
                const isAfterPower = prev && prev.type === 'op' && prev.value === '^';
                out.push({ type: 'op', value: isAfterPower ? 'u-h' : 'u-' });
                continue;
            }
        }

        // Implicit multiply: between number/rparen/fact and number/lparen/fn
        if (prev && (prev.type === 'num' || prev.type === 'rparen' || prev.type === 'fact')) {
            if (tok.type === 'num' || tok.type === 'lparen' ||
                tok.type === 'fn' || tok.type === 'fn2') {
                out.push({ type: 'op', value: '*' });
            }
        }
        out.push(tok);
    }
    return out;
}

/* SHUNTING-YARD: infix tokens → RPN */
function toRPN(tokens) {
    const output = [];
    const stack = [];

    for (const tok of tokens) {
        if (tok.type === 'num') {
            output.push(tok);
        } else if (tok.type === 'fn' || tok.type === 'fn2') {
            stack.push(tok);
        } else if (tok.type === 'comma') {
            while (stack.length && stack[stack.length - 1].type !== 'lparen') {
                output.push(stack.pop());
            }
            if (!stack.length) throw new Error('Misplaced comma');
        } else if (tok.type === 'op') {
            const o1 = OPERATORS[tok.value];
            while (stack.length) {
                const top = stack[stack.length - 1];
                if (top.type === 'op') {
                    const o2 = OPERATORS[top.value];
                    if ((o1.assoc === 'L' && o1.prec <= o2.prec) ||
                        (o1.assoc === 'R' && o1.prec < o2.prec)) {
                        output.push(stack.pop());
                        continue;
                    }
                }
                break;
            }
            stack.push(tok);
        } else if (tok.type === 'fact') {
            // Postfix factorial — apply immediately to top of output
            output.push(tok);
        } else if (tok.type === 'lparen') {
            stack.push(tok);
        } else if (tok.type === 'rparen') {
            while (stack.length && stack[stack.length - 1].type !== 'lparen') {
                output.push(stack.pop());
            }
            if (!stack.length) throw new Error('Mismatched parenthesis');
            stack.pop(); // discard lparen
            // If a function was waiting, pop it
            if (stack.length && (stack[stack.length - 1].type === 'fn' ||
                                 stack[stack.length - 1].type === 'fn2')) {
                output.push(stack.pop());
            }
        }
    }

    while (stack.length) {
        const top = stack.pop();
        if (top.type === 'lparen' || top.type === 'rparen') {
            throw new Error('Mismatched parenthesis');
        }
        output.push(top);
    }
    return output;
}

/* EVALUATE RPN */
function evalRPN(rpn) {
    const stack = [];
    for (const tok of rpn) {
        if (tok.type === 'num') {
            stack.push(tok.value);
        } else if (tok.type === 'op') {
            const op = OPERATORS[tok.value];
            if (op.unary) {
                const a = stack.pop();
                if (a === undefined) throw new Error('Missing operand');
                stack.push(op.fn(a));
            } else {
                const b = stack.pop();
                const a = stack.pop();
                if (a === undefined || b === undefined) throw new Error('Missing operand');
                stack.push(op.fn(a, b));
            }
        } else if (tok.type === 'fn') {
            const a = stack.pop();
            if (a === undefined) throw new Error('Missing argument');
            stack.push(FUNCTIONS[tok.name](a));
        } else if (tok.type === 'fn2') {
            const b = stack.pop();
            const a = stack.pop();
            if (a === undefined || b === undefined) throw new Error('Missing argument');
            stack.push(SPECIAL_FNS_2[tok.name](a, b));
        } else if (tok.type === 'fact') {
            const a = stack.pop();
            if (a === undefined) throw new Error('Missing operand');
            stack.push(factorial(a));
        }
    }
    if (stack.length !== 1) throw new Error('Bad expression');
    const result = stack[0];
    if (!Number.isFinite(result)) {
        if (Number.isNaN(result)) throw new Error('Not a number');
        throw new Error('Infinity');
    }
    return cleanFloat(result);
}

function evaluate(expression) {
    if (!expression || !expression.trim()) return null;
    const tokens = tokenise(expression);
    const rpn = toRPN(tokens);
    return evalRPN(rpn);
}

/* Format a number for display: keep precision but kill trailing zeros */
function formatResult(n) {
    if (n === null || n === undefined) return '';
    if (!Number.isFinite(n)) return String(n);
    const dp = State.get('precision') ?? 10;
    // Very small or very large — use scientific
    if (Math.abs(n) !== 0 && (Math.abs(n) < 1e-6 || Math.abs(n) >= 1e15)) {
        return n.toExponential(6).replace(/\.?0+e/, 'e');
    }
    // Round to dp, strip trailing zeros
    const rounded = Number(n.toFixed(dp));
    return String(rounded);
}

/* ============================================
   SIDEBAR TOGGLE — overlay behaviour for narrow screens
   ============================================ */
function toggleSidebar() {
    if (document.body.classList.contains('sidebar-open')) closeSidebar();
    else openSidebar();
}

function openSidebar() {
    document.body.classList.add('sidebar-open');
    const btn = $('#sidebar-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    // Trap focus to the close button so keyboard users land somewhere sensible
    const close = document.querySelector('.sidebar-close');
    if (close) close.focus();
}

function closeSidebar() {
    document.body.classList.remove('sidebar-open');
    const btn = $('#sidebar-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'false');
}

function navigateAndClose(route) {
    Router.navigate(route);
    closeSidebar();
}

/* The display works like Google's calculator: the big line shows the sum
   as it is typed, and the answer only appears once = is pressed. The small
   line above shows the sum that was just worked out ("12\u00D73 ="), or the last
   answer while a new sum is being typed. */
function displayExpression() {
    if (State.get('justEvaluated') || State.get('error')) {
        return `${State.get('evaluated') || State.get('expression')} =`;
    }
    const ans = State.get('lastAnswer');
    if (ans !== null && ans !== undefined) return `Ans = ${formatResult(ans)}`;
    return '\u00A0';   // non-breaking space to preserve height
}
function displayResult() {
    if (State.get('error')) return State.get('error');
    if (State.get('justEvaluated')) return formatResult(State.get('result'));
    return State.get('expression') || '0';
}
// True while a sum is being typed (as opposed to showing an answer or "0")
function isTyping() {
    return !!State.get('expression') && !State.get('justEvaluated') && !State.get('error');
}
// The LCD lines are right-aligned and clip on the left, which needs
// direction: rtl. <bdi> keeps the sum itself reading left to right,
// otherwise "12\u00D7(3+4)\u00F75" shows as "5\u00F7(3+4)\u00D712".
// The dot-matrix face has no \u00D7 or \u00F7, so the screen shows them the way
// dot-matrix calculators do (x and /) and stays pixel all the way through.
function lcdText(text) {
    const lcd = String(text).replace(/\u00D7/g, 'x').replace(/\u00F7/g, '/').replace(/\u2212/g, '-');
    return `<bdi>${esc(lcd)}</bdi>`;
}

// Memory shows in two small places rather than its own panel: an "M 7"
// indicator on the screen (tap to recall), and a one-line strip under the
// history with a Clear key. Both only appear while something is stored.
// The last answer already shows on the screen as "Ans = …".
function hasMemory() {
    const memory = State.get('memory');
    return memory !== 0 && memory !== null && memory !== undefined;
}
function renderMemPill() {
    if (!hasMemory()) return '';
    const value = formatResult(State.get('memory'));
    return `<button class="pill mem-active" onclick="handleMemory('recall')"
                    aria-label="Memory: ${esc(value)}, tap to recall">M ${esc(value)}</button>`;
}
function renderMemoryStrip() {
    if (!hasMemory()) return '';
    return `
        <div class="memory-strip">
            <span class="memory-label">${esc(t('panel.memory'))}</span>

        </div>`;
}

/* ============================================
   CALCULATOR ACTIONS
   ============================================ */
function handleKey(action) {
    const [type, val] = action.split(':');
    switch (type) {
        case 'append':  appendToExpression(val); break;
        case 'insert':  appendToExpression(val); break;
        case 'fn':      appendToExpression(val + '('); break;
        case 'mem':     handleMemory(val); break;
        case 'action':  handleAction(val); break;
    }
}

function appendToExpression(text) {
    // Build the next state in one pass and commit it with a single State.set,
    // so the onChange listener fires once per keystroke instead of 2-3 times.
    let expression = State.get('expression') || '';
    let justEvaluated = State.get('justEvaluated');
    const wasError = !!State.get('error');

    // If we just showed an error, clear it on next input
    if (wasError) {
        expression = '';
        justEvaluated = false;
    }
    // After pressing equals, digits/decimals/constants start a new expression,
    // but operators (and x², x³, !) chain from the previous result.
    if (justEvaluated) {
        const chains = /^[+\-×÷^%!]/.test(text);
        if (!chains) expression = '';
        // A minus answer needs brackets, or -5 then x² would give -5^2 = -25
        else if (expression.startsWith('-')) expression = `(${expression})`;
        justEvaluated = false;
    }
    // "e" straight after a digit would read as 2e+3 = 2000, so make the
    // multiply explicit and keep it Euler's number
    if (text === 'e' && /[0-9.]$/.test(expression)) text = '×e';

    expression += text;

    // No live answer: it only appears when = is pressed
    State.set({ expression, result: null, error: null, justEvaluated });
}

function handleAction(action) {
    if (action === 'clear') {
        State.set({ expression: '', result: null, error: null, justEvaluated: false });
        return;
    }
    if (action === 'equals') { commitResult(); return; }

    // del and negate both edit the expression and want a fresh preview —
    // do it as one State.set, not two.
    let expression = State.get('expression') || '';
    if (action === 'del') {
        expression = expression.slice(0, -1);
    } else if (action === 'negate') {
        expression = isWrappedNegative(expression) ? expression.slice(2, -1)
                   : (expression ? `-(${expression})` : '-');
    } else {
        return;
    }
    State.set({ expression, result: null, error: null, justEvaluated: false });
}

// True for "-( … )" where the opening bracket closes at the very end, so
// "-(2)+(3)" is not mistaken for a wrapped sum
function isWrappedNegative(expr) {
    if (!expr.startsWith('-(') || !expr.endsWith(')')) return false;
    let depth = 0;
    for (let i = 1; i < expr.length; i++) {
        if (expr[i] === '(') depth++;
        else if (expr[i] === ')' && --depth === 0) return i === expr.length - 1;
    }
    return false;
}

function handleMemory(action) {
    const memory = State.get('memory') || 0;
    // M+ and M− use the answer on show after =, else the sum being typed,
    // else the last answer.
    let value = State.get('justEvaluated') ? State.get('result') : null;
    const expr = State.get('expression');
    if ((value === null || value === undefined) && expr) {
        try { value = evaluate(expr); } catch { value = null; }
    }
    if (value === null || value === undefined) value = State.get('lastAnswer');

    if (action === 'clear') {
        State.set({ memory: 0 });
        Store.set('memory', 0);
        showToast(t('toast.memCleared'));
    } else if (action === 'recall') {
        if (memory !== 0) appendToExpression(memory < 0 ? `(${formatResult(memory)})` : formatResult(memory));
    } else if (action === 'add') {
        if (value !== null && value !== undefined) {
            const next = memory + value;
            State.set({ memory: next });
            Store.set('memory', next);
        }
    } else if (action === 'sub') {
        if (value !== null && value !== undefined) {
            const next = memory - value;
            State.set({ memory: next });
            Store.set('memory', next);
        }
    }
}

// Commit on equals — push to history, set ANS
function commitResult() {
    const expr = State.get('expression');
    if (!expr || !expr.trim()) return;
    // Pressing = again on an answer does nothing, rather than logging "36 = 36"
    if (State.get('justEvaluated')) return;
    try {
        const r = evaluate(expr);
        const formatted = formatResult(r);
        const item = {
            id: uid(),
            expression: expr,
            result: formatted,
            ts: Date.now()
        };
        const history = [item, ...(State.get('history') || [])].slice(0, MAX_HISTORY);
        State.set({
            history,
            lastAnswer: r,
            result: r,
            error: null,
            justEvaluated: true,
            evaluated: expr,
            // Carry the answer so an operator chains from it
            expression: formatted
        });
        Store.set('history', history);
        Store.set('lastAnswer', r);
    } catch (err) {
        State.set({ error: err.message || t('toast.error'), result: null, evaluated: expr });
    }
}

function setAngleMode(mode) {
    State.set({ angleMode: mode });
    Store.set('angleMode', mode);
    // Targeted pill update — no need to rebuild the whole calculator, which
    // would destroy and recreate every keypad button and risk dropping a
    // follow-up tap on iOS Safari.
    if (Router.getCurrent() === '/calc') {
        const deg = $('#angle-deg');
        const rad = $('#angle-rad');
        if (deg) {
            deg.classList.toggle('active', mode === 'deg');
            deg.setAttribute('aria-pressed', String(mode === 'deg'));
        }
        if (rad) {
            rad.classList.toggle('active', mode === 'rad');
            rad.setAttribute('aria-pressed', String(mode === 'rad'));
        }
    }
}

let _modeSwitchToken = 0;

function setCalcMode(mode) {
    if (State.get('calcMode') === mode) return;
    State.set({ calcMode: mode });
    Store.set('calcMode', mode);
    const token = ++_modeSwitchToken;

    // Light the chosen mode key straight away, before any animation
    $$('.mode-toggle .pill').forEach((btn, i) => {
        const on = (i === 0) === (mode === 'standard');
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', String(on));
    });

    // Going to Standard: fold the science keys up first, so the calculator
    // closes as smoothly as it opens, then redraw. A newer switch made during
    // the fold wins (the token check), so quick double-clicks can't stack.
    const fn = mode === 'standard' ? $('.keypad-fn') : null;
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (fn && fn.animate && !reduceMotion) {
        const gap = getComputedStyle(fn.parentElement).rowGap;
        const pad = getComputedStyle(fn).paddingTop;
        fn.style.overflow = 'hidden';
        const fold = fn.animate([
            { maxHeight: fn.offsetHeight + 'px', opacity: 1, paddingTop: pad, marginTop: '0px', borderTopWidth: '1px' },
            { maxHeight: '0px', opacity: 0, paddingTop: '0px', marginTop: `calc(-1 * ${gap})`, borderTopWidth: '0px' }
        ], { duration: 280, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' });
        fold.finished
            .then(() => { if (token === _modeSwitchToken) renderCalcPage(); })
            .catch(() => {});   // cancelled: the page was redrawn mid-fold
        return;
    }

    _calcModeChanged = mode === 'scientific';
    renderCalcPage();
}

function recallHistory(id) {
    const item = (State.get('history') || []).find(h => h.id === id);
    if (!item) return;
    // Re-evaluate to get a numeric result, but fall back to parsing the stored
    // formatted result if the expression itself fails. This keeps recalled values
    // visible even if the stored expression somehow can't be re-evaluated.
    let r = null;
    try { r = evaluate(item.expression); }
    catch { r = parseFloat(item.result); }
    State.set({
        expression: item.expression,
        result: Number.isFinite(r) ? r : null,
        error: null,
        justEvaluated: false
    });
    Router.navigate('/calc');
    // Brief visual confirmation that recall happened
    showToast(t('toast.recalled') || 'Recalled');
}

function clearHistory() {
    State.set({ history: [] });
    Store.set('history', []);
    showToast(t('toast.cleared'));

function memClear() {

}

   ============================================ */
const UNIT_CATEGORIES = {

function convertTemperature(value, from, to) {
    // Convert to Celsius first, then to target
    let c;
    if (from === 'C') c = value;
    else if (from === 'F') c = (value - 32) * 5 / 9;
    else if (from === 'K') c = value - 273.15;
    if (to === 'C') return c;
    if (to === 'F') return c * 9 / 5 + 32;
    if (to === 'K') return c + 273.15;
    return c;
}

function convertUnit(value, category, from, to) {
    if (category === 'temperature') return convertTemperature(value, from, to);
    const cat = UNIT_CATEGORIES[category];
    if (!cat || !cat.units[from] || !cat.units[to]) return null;
    const baseValue = value * cat.units[from].factor;
    return baseValue / cat.units[to].factor;
}

function renderUnitConverterPage() {
    const cat = State.get('unitCategory') || 'length';
    const fromUnit = State.get('unitFrom') || (cat === 'temperature' ? 'C' : Object.keys(UNIT_CATEGORIES[cat].units)[0]);
    const toUnit = State.get('unitTo') || (cat === 'temperature' ? 'F' : Object.keys(UNIT_CATEGORIES[cat].units)[1]);
    const inputValue = State.get('unitInput') ?? 1;

    const tempUnits = { C: 'Celsius', F: 'Fahrenheit', K: 'Kelvin' };
    const units = cat === 'temperature' ? tempUnits :
        Object.fromEntries(Object.entries(UNIT_CATEGORIES[cat].units).map(([k, v]) => [k, v.label]));

    let result = '';
    try {
        const r = convertUnit(parseFloat(inputValue) || 0, cat, fromUnit, toUnit);
        result = formatResult(r);
    } catch { result = '—'; }

function setUnitCategory(category) {
    const cat = UNIT_CATEGORIES[category];
    let from, to;
    if (category === 'temperature') {
        from = 'C'; to = 'F';
    } else {
        const keys = Object.keys(cat.units);
        from = keys[0]; to = keys[1] || keys[0];
    }
    State.set({ unitCategory: category, unitFrom: from, unitTo: to });
    renderUnitConverterPage();
}

function setUnitInput(value) {
    State.set({ unitInput: value });
    // Just re-render the result side, not the full page (would lose focus)
    const cat = State.get('unitCategory') || 'length';
    const fromUnit = State.get('unitFrom');
    const toUnit = State.get('unitTo');
    const r = convertUnit(parseFloat(value) || 0, cat, fromUnit, toUnit);
    const inputs = $$('.unit-side input[readonly]');
    if (inputs[0]) inputs[0].value = formatResult(r);
}

function swapUnits() {
    const from = State.get('unitFrom');
    const to = State.get('unitTo');
    State.set({ unitFrom: to, unitTo: from });
    renderUnitConverterPage();
}

/* ============================================
   PAGE: PROGRAMMER MODE
   Shows decimal/hex/binary/octal of an integer plus
   bitwise ops. Click a bit to toggle it.
   ============================================ */
function renderProgrammerPage() {
    const value = State.get('progValue') || 0;
    const bitWidth = State.get('progBitWidth') || 8;
    const textBinaryInput = State.get('textBinaryInput') || '';

    // Sanitise: keep value as a non-negative integer fitting in bitWidth
    const maxVal = Math.pow(2, bitWidth) - 1;
    const v = Math.max(0, Math.min(maxVal, Math.floor(Math.abs(value))));
    if (v !== value) State.set({ progValue: v });

    const bits = v.toString(2).padStart(bitWidth, '0');
    const bitArr = bits.split('').map(b => b === '1');

    // Render bits in groups of 8, MSB first
    const bitRows = [];
    for (let i = 0; i < bitWidth; i += 8) {
        const slice = bitArr.slice(i, i + 8);
        bitRows.push({ start: bitWidth - i - 1, bits: slice });
    }

    html('#main-content', `
        <header class="page-header">
            <h1 class="page-title">${esc(t('nav.programmer'))}</h1>
            <p class="page-subtitle">Convert numbers and text to binary</p>
        </header>

        <div class="tool-card">
            <h3>Decimal Input</h3>
            <div class="tool-row">
                <label class="tool-label" for="prog-input">Value</label>
                <input id="prog-input" type="number" class="tool-input"
                       value="${esc(String(v))}"
                       min="0" max="${maxVal}"
                       oninput="setProgInputDec(this.value)"
                       aria-label="Decimal value">
                <select class="tool-select" onchange="State.set({progBitWidth:parseInt(this.value)}); renderProgrammerPage();"
                        aria-label="${esc(t('prog.width'))}">
                    <option value="8"  ${bitWidth === 8  ? 'selected' : ''}>8-bit</option>
                    <option value="16" ${bitWidth === 16 ? 'selected' : ''}>16-bit</option>
                    <option value="32" ${bitWidth === 32 ? 'selected' : ''}>32-bit</option>
                </select>
            </div>

            <div class="prog-display" id="prog-values" role="region" aria-label="Binary representation">
                <div class="prog-row">
                    <span class="prog-base">DEC</span>
                    <span class="prog-value">${esc(v.toString(10))}</span>
                </div>
                <div class="prog-row">
                    <span class="prog-base">BIN</span>
                    <span class="prog-value">${esc(bits.match(/.{1,8}/g).join(' '))}</span>
                </div>
            </div>
        </div>

        <div class="tool-card">
            <h3>${esc(t('prog.bits'))}</h3>
            <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.75rem">
                Tap a bit to toggle it on or off
            </p>
            <div id="prog-bits-grid">
                ${renderProgBitsHtml(bitRows)}
            </div>
        </div>

        <div class="tool-card">
            <h3>Text to Binary</h3>
            <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.75rem">
                Type text to see its binary (UTF-8, 8 bits per byte) representation
            </p>
            <textarea class="tool-textarea" id="text-binary-input"
                      placeholder="Type text here..."
                      oninput="updateTextToBinary(this.value)"
                      aria-label="Text to convert to binary">${esc(textBinaryInput)}</textarea>
            <div class="result-box" id="text-binary-output"
                 style="margin-top:0.75rem;white-space:pre-wrap;line-height:1.6"
                 aria-live="polite">${esc(textToBinaryStr(textBinaryInput))}</div>
            <div class="tool-row" style="margin-top:0.75rem">
                <button class="tool-btn" onclick="copyTextBinary()">Copy binary</button>
            </div>
        </div>
    `);
}

// Convert a string to space-separated 8-bit binary, one group per UTF-8 byte.
function textToBinaryStr(text) {
    if (!text) return '';
    const bytes = new TextEncoder().encode(text);
    return Array.from(bytes).map(b => b.toString(2).padStart(8, '0')).join(' ');
}

function updateTextToBinary(text) {
    State.set({ textBinaryInput: text });
    const out = $('#text-binary-output');
    if (out) out.textContent = textToBinaryStr(text);
}

function copyTextBinary() {
    const text = textToBinaryStr(State.get('textBinaryInput') || '');
    if (!text) { showToast('Nothing to copy'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
            () => showToast('Binary copied'),
            () => showToast('Copy failed')
        );
    } else {
        showToast('Copy not supported');
    }
}

function setProgInputDec(str) {
    const value = parseInt(str, 10) || 0;
    const bitWidth = State.get('progBitWidth') || 8;
    const maxVal = Math.pow(2, bitWidth) - 1;
    const v = Math.max(0, Math.min(maxVal, Math.floor(Math.abs(value))));
    State.set({ progValue: v });

    // Targeted updates - leave the input alone
    const bits = v.toString(2).padStart(bitWidth, '0');
    const bitArr = bits.split('').map(b => b === '1');
    const bitRows = [];
    for (let i = 0; i < bitWidth; i += 8) {
        bitRows.push({ start: bitWidth - i - 1, bits: bitArr.slice(i, i + 8) });
    }
    const valuesEl = $('#prog-values');
    const bitsEl = $('#prog-bits-grid');
    if (valuesEl) valuesEl.innerHTML = `
        <div class="prog-row">
            <span class="prog-base">DEC</span>
            <span class="prog-value">${esc(v.toString(10))}</span>
        </div>
        <div class="prog-row">
            <span class="prog-base">BIN</span>
            <span class="prog-value">${esc(bits.match(/.{1,8}/g).join(' '))}</span>
        </div>
    `;
    if (bitsEl) bitsEl.innerHTML = renderProgBitsHtml(bitRows);
}

function renderProgBitsHtml(bitRows) {
    return bitRows.map(row => `
        <div style="margin-bottom:0.75rem">
            <div class="prog-bits">
                ${row.bits.map((on, idx) => {
                    const bitIndex = row.start - idx;
                    return `
                        <button class="prog-bit ${on ? 'on' : ''}"
                                onclick="toggleBit(${bitIndex})"
                                aria-label="Bit ${bitIndex} ${on ? 'on' : 'off'}"
                                aria-pressed="${on}">${on ? '1' : '0'}</button>
                    `;
                }).join('')}
            </div>
            <div class="prog-bits">
                ${row.bits.map((_, idx) => {
                    const bitIndex = row.start - idx;
                    return `<div class="prog-bit-index">${bitIndex}</div>`;
                }).join('')}
            </div>
        </div>
    `).join('');
}

function toggleBit(index) {
    const value = State.get('progValue') || 0;
    // Use BigInt for bits beyond 32 to avoid sign issues
    const next = (Number(BigInt(value) ^ (1n << BigInt(index))));
    State.set({ progValue: next });
    renderProgrammerPage();
}

/* ============================================
   PAGE: STATISTICS
   Paste numbers (any whitespace, comma, newline).
   Computes mean, median, mode, range, variance, SD,
   plus linear regression if two columns are given.
   ============================================ */
function parseStatsInput(text) {
    if (!text || !text.trim()) return { single: [], pairs: [] };
    const rows = text.split(/[\n;]/)
        .map(line => line.split(/[\s,]+/).map(parseFloat).filter(n => !isNaN(n)))
        .filter(row => row.length);
    // Two columns on every line (and at least two lines) is an x,y table for
    // regression; the stats then describe y. Anything else is one flat list.
    if (rows.length >= 2 && rows.every(row => row.length === 2)) {
        return { single: rows.map(row => row[1]), pairs: rows };
    }
    return { single: rows.flat(), pairs: [] };
}

function computeStats(arr) {
    if (!arr.length) return null;
    const n = arr.length;
    const sum = arr.reduce((a, b) => a + b, 0);
    const mean = sum / n;
    const sorted = [...arr].sort((a, b) => a - b);
    const median = n % 2 ? sorted[Math.floor(n / 2)] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
    // Mode — most frequent value(s)
    const counts = new Map();
    for (const x of arr) counts.set(x, (counts.get(x) || 0) + 1);
    let modeCount = 0;
    for (const c of counts.values()) modeCount = Math.max(modeCount, c);
    const modes = modeCount === 1 ? [] : [...counts.entries()].filter(([_, c]) => c === modeCount).map(([v]) => v);
    const min = sorted[0];
    const max = sorted[n - 1];
    const range = max - min;
    // Population variance and SD
    const variance = arr.reduce((s, x) => s + (x - mean) ** 2, 0) / n;
    const sampleVariance = n > 1 ? arr.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1) : 0;
    return {
        n, sum, mean, median, modes, min, max, range,
        variance: cleanFloat(variance),
        stddev: cleanFloat(Math.sqrt(variance)),
        sampleVariance: cleanFloat(sampleVariance),
        sampleStddev: cleanFloat(Math.sqrt(sampleVariance))
    };
}

function computeRegression(pairs) {
    const n = pairs.length;
    if (n < 2) return null;
    const xs = pairs.map(p => p[0]);
    const ys = pairs.map(p => p[1]);
    const meanX = xs.reduce((a, b) => a + b, 0) / n;
    const meanY = ys.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) {
        num += (xs[i] - meanX) * (ys[i] - meanY);
        den += (xs[i] - meanX) ** 2;
    }
    if (den === 0) return null;
    const slope = num / den;
    const intercept = meanY - slope * meanX;
    // Pearson r
    let sx = 0, sy = 0;
    for (let i = 0; i < n; i++) {
        sx += (xs[i] - meanX) ** 2;
        sy += (ys[i] - meanY) ** 2;
    }
    const r = (sx === 0 || sy === 0) ? 0 : num / Math.sqrt(sx * sy);
    return {
        slope: cleanFloat(slope),
        intercept: cleanFloat(intercept),
        r: cleanFloat(r),
        r2: cleanFloat(r * r)
    };
}

/* ============================================
   PAGE: EQUATION SOLVER
   Linear (ax + b = 0), quadratic (ax² + bx + c = 0),
   cubic (ax³ + bx² + cx + d = 0) — closed-form solutions.
   ============================================ */
function solveLinear(a, b) {
    if (a === 0) return b === 0 ? { type: 'infinite' } : { type: 'none' };
    return { type: 'real', solutions: [{ label: 'x', value: -b / a }] };
}

function solveQuadratic(a, b, c) {
    if (a === 0) return solveLinear(b, c);
    const disc = b * b - 4 * a * c;
    if (Math.abs(disc) < FLOAT_EPSILON) {
        return { type: 'real', solutions: [{ label: 'x', value: -b / (2 * a) }] };
    }
    if (disc > 0) {
        const sq = Math.sqrt(disc);
        return { type: 'real', solutions: [
            { label: 'x₁', value: (-b + sq) / (2 * a) },
            { label: 'x₂', value: (-b - sq) / (2 * a) }
        ]};
    }
    const sq = Math.sqrt(-disc);
    const real = -b / (2 * a);
    const imag = sq / (2 * a);
    return { type: 'complex', solutions: [
        { label: 'x₁', real, imag },
        { label: 'x₂', real, imag: -imag }
    ]};
}

function solveCubic(a, b, c, d) {
    if (a === 0) return solveQuadratic(b, c, d);
    // Normalise to depressed cubic via Cardano's method
    const A = b / a, B = c / a, C = d / a;
    const p = B - A * A / 3;
    const q = 2 * A * A * A / 27 - A * B / 3 + C;
    const disc = q * q / 4 + p * p * p / 27;
    const offset = -A / 3;
    const sols = [];
    if (Math.abs(disc) < FLOAT_EPSILON) {
        // Multiple real roots
        const u = Math.cbrt(-q / 2);
        sols.push({ label: 'x₁', value: 2 * u + offset });
        sols.push({ label: 'x₂', value: -u + offset });
        return { type: 'real', solutions: sols };
    }
    if (disc > 0) {
        // One real root + two complex
        const sq = Math.sqrt(disc);
        const u = Math.cbrt(-q / 2 + sq);
        const v = Math.cbrt(-q / 2 - sq);
        const real = u + v;
        const realPart = -(u + v) / 2 + offset;
        const imagPart = (u - v) * Math.sqrt(3) / 2;
        return { type: 'mixed', solutions: [
            { label: 'x₁', value: real + offset },
            { label: 'x₂', real: realPart, imag: imagPart },
            { label: 'x₃', real: realPart, imag: -imagPart }
        ]};
    }
    // Three distinct real roots — trigonometric method
    const r = Math.sqrt(-p * p * p / 27);
    const phi = Math.acos(-q / (2 * r));
    const t = 2 * Math.cbrt(r);
    sols.push({ label: 'x₁', value: t * Math.cos(phi / 3) + offset });
    sols.push({ label: 'x₂', value: t * Math.cos((phi + 2 * Math.PI) / 3) + offset });
    sols.push({ label: 'x₃', value: t * Math.cos((phi + 4 * Math.PI) / 3) + offset });
    return { type: 'real', solutions: sols };
}

// Compute current solutions and return HTML — used by both initial render and live update
function renderEqSolutionsHtml() {
    const mode = State.get('eqMode') || 'quadratic';
    const coefs = State.get('eqCoefs') || { a: 1, b: 0, c: 0, d: 0 };
    let solution = null;
    let error = null;
    try {
        const a = parseFloat(coefs.a) || 0;
        const b = parseFloat(coefs.b) || 0;
        const c = parseFloat(coefs.c) || 0;
        const d = parseFloat(coefs.d) || 0;
        if (mode === 'linear')    solution = solveLinear(a, b);
        if (mode === 'quadratic') solution = solveQuadratic(a, b, c);
        if (mode === 'cubic')     solution = solveCubic(a, b, c, d);
    } catch (err) { error = err.message; }
    return renderSolutions(solution, error);
}

function renderSolutions(solution, error) {
    if (error) return `<div class="result-box error">${esc(error)}</div>`;
    if (!solution) return `<div class="result-box muted">—</div>`;
    if (solution.type === 'infinite') return `<div class="result-box muted">${esc(t('eq.infinite'))}</div>`;
    if (solution.type === 'none') return `<div class="result-box muted">${esc(t('eq.none'))}</div>`;
    return `<div class="solutions">${solution.solutions.map(s => {
        if (s.value !== undefined) {
            return `<div class="solution">
                <span class="solution-label">${esc(s.label)} =</span>
                <span class="solution-value">${esc(formatResult(s.value))}</span>
            </div>`;
        }
        const sign = s.imag >= 0 ? '+' : '−';
        return `<div class="solution">
            <span class="solution-label">${esc(s.label)} =</span>
            <span class="solution-value">${esc(formatResult(s.real))} ${sign} ${esc(formatResult(Math.abs(s.imag)))}i</span>
        </div>`;
    }).join('')}</div>`;
}

function setEqCoef(key, value) {
    const coefs = { a: 1, b: 0, c: 0, d: 0, ...(State.get('eqCoefs') || {}) };

/* ============================================
   PAGE: MATRIX
   Two matrices, A and B. Add, multiply, transpose,
   determinant (square only), inverse (square only).
   Stored as 2D arrays of strings so users can type
   freely and we parse on demand.
   ============================================ */
function emptyMatrix(rows, cols, fill = '') {
    return Array.from({ length: rows }, () => Array(cols).fill(fill));
}

function parseMatrix(m) {
    return m.map(row => row.map(cell => {
        const n = parseFloat(cell);
        return Number.isFinite(n) ? n : 0;
    }));
}

function matAdd(A, B) {
    if (A.length !== B.length || A[0].length !== B[0].length) throw new Error('Size mismatch');
    return A.map((row, i) => row.map((v, j) => v + B[i][j]));
}
function matSub(A, B) {
    if (A.length !== B.length || A[0].length !== B[0].length) throw new Error('Size mismatch');
    return A.map((row, i) => row.map((v, j) => v - B[i][j]));
}
function matMul(A, B) {
    if (A[0].length !== B.length) throw new Error('Inner dims mismatch');
    const out = emptyMatrix(A.length, B[0].length, 0);
    for (let i = 0; i < A.length; i++) {
        for (let j = 0; j < B[0].length; j++) {
            let s = 0;
            for (let k = 0; k < B.length; k++) s += A[i][k] * B[k][j];
            out[i][j] = s;
        }
    }
    return out;
}
function matTranspose(A) {
    return A[0].map((_, j) => A.map(row => row[j]));
}
function matDet(A) {
    const n = A.length;
    if (n !== A[0].length) throw new Error('Not square');
    if (n === 1) return A[0][0];
    if (n === 2) return A[0][0] * A[1][1] - A[0][1] * A[1][0];
    // Gaussian elimination on a copy
    const M = A.map(r => [...r]);
    let det = 1;
    for (let i = 0; i < n; i++) {
        // Find pivot
        let pivot = i;
        for (let k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[pivot][i])) pivot = k;
        if (Math.abs(M[pivot][i]) < FLOAT_EPSILON) return 0;
        if (pivot !== i) { [M[i], M[pivot]] = [M[pivot], M[i]]; det = -det; }
        det *= M[i][i];
        for (let k = i + 1; k < n; k++) {
            const f = M[k][i] / M[i][i];
            for (let j = i; j < n; j++) M[k][j] -= f * M[i][j];
        }
    }
    return cleanFloat(det);
}
function matInverse(A) {
    const n = A.length;
    if (n !== A[0].length) throw new Error('Not square');
    // Build augmented [A | I]
    const M = A.map((row, i) => [...row, ...Array.from({ length: n }, (_, j) => i === j ? 1 : 0)]);
    for (let i = 0; i < n; i++) {
        let pivot = i;
        for (let k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[pivot][i])) pivot = k;
        if (Math.abs(M[pivot][i]) < FLOAT_EPSILON) throw new Error('Singular');
        if (pivot !== i) [M[i], M[pivot]] = [M[pivot], M[i]];
        const piv = M[i][i];
        for (let j = 0; j < 2 * n; j++) M[i][j] /= piv;
        for (let k = 0; k < n; k++) {
            if (k === i) continue;
            const f = M[k][i];
            for (let j = 0; j < 2 * n; j++) M[k][j] -= f * M[i][j];
        }
    }
    return M.map(row => row.slice(n).map(cleanFloat));
}

function renderMatrixPage() {

function renderMatrix(M, name) {
    const rows = M.length;
    const cols = M[0]?.length || 0;
    return `
        <div class="matrix-size">

            <input type="number" class="tool-input" min="1" max="6" value="${rows}"

                   aria-label="${name} rows">
            <span>×</span>
            <input type="number" class="tool-input" min="1" max="6" value="${cols}"
                   onchange="resizeMatrix('${name}', ${rows}, parseInt(this.value))"
                   aria-label="${name} columns">
            <button class="tool-btn" onclick="fillMatrixIdentity('${name}')"
                    style="margin-left:auto">${esc(t('mat.identity'))}</button>
            <button class="tool-btn" onclick="fillMatrixZero('${name}')">${esc(t('mat.zero'))}</button>
        </div>
        <div class="matrix-grid" style="grid-template-columns: repeat(${cols}, auto)">
            ${M.flatMap((row, i) =>
                row.map((cell, j) => `
                    <input type="text" class="matrix-cell" value="${esc(cell)}"
                           oninput="updateMatrixCell('${name}', ${i}, ${j}, this.value)"
                           aria-label="${name} row ${i + 1} column ${j + 1}">
                `)
            ).join('')}
        </div>
    `;
}

function renderMatrixReadonly(M) {
    const cols = M[0]?.length || 0;
    return `
        <div class="matrix-grid" style="grid-template-columns: repeat(${cols}, auto)">
            ${M.flatMap(row =>
                row.map(cell => `
                    <input type="text" class="matrix-cell readonly" readonly
                           value="${esc(formatResult(cell))}" tabindex="-1">
                `)
            ).join('')}
        </div>
    `;
}

function updateMatrixCell(name, i, j, value) {
    const key = name === 'A' ? 'matA' : 'matB';
    const M = (State.get(key) || emptyMatrix(2, 2)).map(r => [...r]);
    M[i][j] = value;
    State.set({ [key]: M });
    // Don't full re-render — would lose focus. Just store.
}

function resizeMatrix(name, rows, cols) {
    rows = Math.min(6, Math.max(1, parseInt(rows) || 1));
    cols = Math.min(6, Math.max(1, parseInt(cols) || 1));
    const key = name === 'A' ? 'matA' : 'matB';
    const old = State.get(key) || emptyMatrix(2, 2);
    const next = emptyMatrix(rows, cols);
    for (let i = 0; i < Math.min(rows, old.length); i++) {
        for (let j = 0; j < Math.min(cols, old[0].length); j++) {
            next[i][j] = old[i][j] || '';
        }
    }
    State.set({ [key]: next });
    renderMatrixPage();
}

function fillMatrixIdentity(name) {
    const key = name === 'A' ? 'matA' : 'matB';
    const M = State.get(key) || emptyMatrix(2, 2);
    const n = Math.min(M.length, M[0].length);
    const next = emptyMatrix(M.length, M[0].length, '0');
    for (let i = 0; i < n; i++) next[i][i] = '1';
    State.set({ [key]: next });
    renderMatrixPage();
}
function fillMatrixZero(name) {
    const key = name === 'A' ? 'matA' : 'matB';
    const M = State.get(key) || emptyMatrix(2, 2);
    State.set({ [key]: emptyMatrix(M.length, M[0].length, '0') });
    renderMatrixPage();
}

function matrixOp(op) {
    try {
        const A = parseMatrix(State.get('matA') || emptyMatrix(2, 2));
        const B = parseMatrix(State.get('matB') || emptyMatrix(2, 2));
        let result;
        if (op === 'add') result = matAdd(A, B);
        else if (op === 'sub') result = matSub(A, B);
        else if (op === 'mul') result = matMul(A, B);
        else if (op === 'transposeA') result = matTranspose(A);
        else if (op === 'transposeB') result = matTranspose(B);
        else if (op === 'detA') result = matDet(A);
        else if (op === 'detB') result = matDet(B);
        else if (op === 'invA') result = matInverse(A);
        else if (op === 'invB') result = matInverse(B);
        State.set({ matResult: result, matError: null });
    } catch (err) {
        State.set({ matResult: null, matError: err.message });
    }
    renderMatrixPage();
}

/* ============================================
   PAGE: GRAPHING
   Plot y = f(x) using the existing maths parser.
   SVG-based, with zoom (wheel + buttons) and pan (drag).
   ============================================ */
function evaluateAtX(expression, x) {
    // Inject x into the parser by temporarily adding it as a constant
    CONSTANTS.x = x;
    try {
        return evaluate(expression);
    } finally {
        delete CONSTANTS.x;
    }
}

function renderGraphPage() {
    const fn = State.get('graphFn') ?? 'sin(x)';
    const xMin = State.get('graphXMin') ?? -10;
    const xMax = State.get('graphXMax') ?? 10;
    const yMin = State.get('graphYMin') ?? -5;
    const yMax = State.get('graphYMax') ?? 5;

    html('#main-content', `
        <header class="page-header">
            <h1 class="page-title">${esc(t('nav.graph'))}</h1>
            <p class="page-subtitle">${esc(t('page.graph.subtitle'))}</p>
        </header>

        <div class="tool-card">
            <div class="tool-row">
                <span class="tool-label">y =</span>

                       oninput="setGraphFn(this.value)"
                       placeholder="e.g. sin(x), x^2, 2x+1, exp(-x^2)"
                       aria-label="${esc(t('graph.fn'))}">
            </div>

                <span class="tool-label">x range</span>
                <input type="number" class="tool-input" value="${xMin}" step="any"

                       aria-label="x min">

                <input type="number" class="tool-input" value="${yMin}" step="any"
                       onchange="setGraphRange('graphYMin', this.value)"
                       aria-label="y min">
                <span class="eq-token">to</span>
                <input type="number" class="tool-input" value="${yMax}" step="any"
                       onchange="setGraphRange('graphYMax', this.value)"
                       aria-label="y max">
                <button class="tool-btn" style="margin-left:auto" onclick="graphReset()">${esc(t('graph.reset'))}</button>
            </div>
        </div>

        <div class="graph-canvas-wrap" id="graph-wrap" role="img"
             aria-label="${esc(t('graph.aria'))} y equals ${esc(fn)}"
             onwheel="graphWheel(event)"
             onmousedown="graphPanStart(event)"
             ontouchstart="graphPanStart(event)">
            ${renderGraphSVG(fn, xMin, xMax, yMin, yMax)}

                <button onclick="graphZoom(0.8)" aria-label="${esc(t('graph.zoomIn'))}">＋</button>
                <button onclick="graphZoom(1.25)" aria-label="${esc(t('graph.zoomOut'))}">−</button>
                <button onclick="graphReset()" aria-label="${esc(t('graph.reset'))}">⟲</button>
            </div>
        </div>

        <div class="graph-info">

            <span>y: ${formatResult(yMin)} → ${formatResult(yMax)}</span>
            <span>${esc(t('graph.tip'))}</span>
        </div>
    `);
}

function renderGraphSVG(fn, xMin, xMax, yMin, yMax) {
    const W = 800, H = 500;
    const padding = 30;
    const plotW = W - 2 * padding;
    const plotH = H - 2 * padding;

    const xScale = x => padding + ((x - xMin) / (xMax - xMin)) * plotW;
    const yScale = y => padding + plotH - ((y - yMin) / (yMax - yMin)) * plotH;

    // Sample the function — break path on discontinuities (huge jumps or NaN)
    const samples = 800;
    let path = '';
    let lastValid = false;
    for (let i = 0; i <= samples; i++) {
        const x = xMin + (xMax - xMin) * (i / samples);
        let y;
        try {
            y = evaluateAtX(fn, x);
        } catch {
            y = NaN;
        }
        if (!Number.isFinite(y)) {
            lastValid = false;
            continue;
        }
        // Clip extreme values (limits big spikes from skewing the path)
        const yClamped = Math.max(yMin - (yMax - yMin), Math.min(yMax + (yMax - yMin), y));
        const cmd = lastValid ? 'L' : 'M';
        path += `${cmd}${xScale(x).toFixed(2)},${yScale(yClamped).toFixed(2)} `;
        lastValid = true;
    }

    // Gridlines — pick step that yields ~10 lines
    const xStep = niceStep((xMax - xMin) / 10);
    const yStep = niceStep((yMax - yMin) / 10);
    const xLines = [];
    for (let v = Math.ceil(xMin / xStep) * xStep; v <= xMax; v += xStep) xLines.push(v);
    const yLines = [];
    for (let v = Math.ceil(yMin / yStep) * yStep; v <= yMax; v += yStep) yLines.push(v);

    const xZero = xMin <= 0 && xMax >= 0 ? xScale(0) : null;
    const yZero = yMin <= 0 && yMax >= 0 ? yScale(0) : null;

    return `
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
            <g class="graph-grid" stroke-width="1">
                ${xLines.map(v => `<line x1="${xScale(v)}" y1="${padding}" x2="${xScale(v)}" y2="${H - padding}"/>`).join('')}
                ${yLines.map(v => `<line x1="${padding}" y1="${yScale(v)}" x2="${W - padding}" y2="${yScale(v)}"/>`).join('')}
            </g>
            ${xZero !== null ? `<line x1="${xZero}" y1="${padding}" x2="${xZero}" y2="${H - padding}" class="graph-axis" stroke-width="1.5"/>` : ''}
            ${yZero !== null ? `<line x1="${padding}" y1="${yZero}" x2="${W - padding}" y2="${yZero}" class="graph-axis" stroke-width="1.5"/>` : ''}
            <g class="graph-labels" font-size="12.5">
                ${xLines.map(v => v !== 0 ? `<text x="${xScale(v)}" y="${(yZero || (H - padding)) + 14}" text-anchor="middle">${formatResult(v)}</text>` : '').join('')}
                ${yLines.map(v => v !== 0 ? `<text x="${(xZero || padding) - 4}" y="${yScale(v) + 4}" text-anchor="end">${formatResult(v)}</text>` : '').join('')}
            </g>
            <path d="${path}" fill="none" class="graph-curve" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
    `;
}

function niceStep(raw) {
    // Round to a nice value: 1, 2, 5, 10, 20, 50, 100...
    if (raw <= 0) return 1;
    const exp = Math.floor(Math.log10(raw));
    const f = raw / Math.pow(10, exp);
    const nice = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
    return nice * Math.pow(10, exp);
}

function setGraphFn(fn) {
    State.set({ graphFn: fn });
    // Re-render only the SVG so input stays focused
    const wrap = $('#graph-wrap');
    if (!wrap) return renderGraphPage();
    const xMin = State.get('graphXMin'), xMax = State.get('graphXMax');
    const yMin = State.get('graphYMin'), yMax = State.get('graphYMax');
    const overlay = wrap.querySelector('.graph-overlay');
    wrap.innerHTML = renderGraphSVG(fn, xMin, xMax, yMin, yMax);
    if (overlay) wrap.appendChild(overlay);
    else {
        wrap.insertAdjacentHTML('beforeend', `
            <div class="graph-overlay">
                <button onclick="graphZoom(0.8)">＋</button>
                <button onclick="graphZoom(1.25)">−</button>
                <button onclick="graphReset()">⟲</button>
            </div>
        `);
    }
}

function graphZoom(factor, focusX, focusY) {
    const xMin = State.get('graphXMin'), xMax = State.get('graphXMax');
    const yMin = State.get('graphYMin'), yMax = State.get('graphYMax');
    // Default focus: centre of the graph (used by the +/- buttons)
    const fx = focusX === undefined ? (xMin + xMax) / 2 : focusX;
    const fy = focusY === undefined ? (yMin + yMax) / 2 : focusY;
    // Keep the focus point fixed: the new range is the old range scaled around fx/fy
    const newXMin = fx - (fx - xMin) * factor;
    const newXMax = fx + (xMax - fx) * factor;
    const newYMin = fy - (fy - yMin) * factor;
    const newYMax = fy + (yMax - fy) * factor;
    State.set({
        graphXMin: newXMin, graphXMax: newXMax,
        graphYMin: newYMin, graphYMax: newYMax
    });
    renderGraphPage();
}

function setGraphRange(key, value) {
    const v = parseFloat(value);
    const range = {
        graphXMin: State.get('graphXMin'), graphXMax: State.get('graphXMax'),
        graphYMin: State.get('graphYMin'), graphYMax: State.get('graphYMax'),
        [key]: v
    };
    if (!Number.isFinite(v) || range.graphXMin >= range.graphXMax || range.graphYMin >= range.graphYMax) {
        showToast(t('graph.badRange'));
        renderGraphPage();   // puts the old value back in the box
        return;
    }
    State.set({ [key]: v });
    renderGraphPage();
}

function graphReset() {
    State.set({
        graphXMin: -10, graphXMax: 10,
        graphYMin: -5, graphYMax: 5
    });
    renderGraphPage();
}

function graphWheel(e) {
    e.preventDefault();
    // Convert cursor pixel position to graph coordinates so we zoom toward it.
    // The SVG fills the wrap, so we use the wrap's bounding rect.
    const wrap = $('#graph-wrap');
    if (!wrap) return graphZoom(e.deltaY > 0 ? 1.1 : 0.9);
    const rect = wrap.getBoundingClientRect();
    const xMin = State.get('graphXMin'), xMax = State.get('graphXMax');
    const yMin = State.get('graphYMin'), yMax = State.get('graphYMax');
    const cursorXFrac = (e.clientX - rect.left) / rect.width;
    const cursorYFrac = (e.clientY - rect.top) / rect.height;
    const focusX = xMin + cursorXFrac * (xMax - xMin);
    // Y axis is inverted in screen space (top-left origin) vs graph space (bottom-left)
    const focusY = yMax - cursorYFrac * (yMax - yMin);
    graphZoom(e.deltaY > 0 ? 1.1 : 0.9, focusX, focusY);
}

let _panState = null;
function graphPanStart(e) {
    e.preventDefault();
    const wrap = $('#graph-wrap');
    if (!wrap) return;
    wrap.classList.add('panning');
    const t = e.touches ? e.touches[0] : e;
    _panState = {
        startX: t.clientX, startY: t.clientY,
        rect: wrap.getBoundingClientRect(),
        xMin: State.get('graphXMin'), xMax: State.get('graphXMax'),
        yMin: State.get('graphYMin'), yMax: State.get('graphYMax')
    };
    document.addEventListener('mousemove', graphPanMove);
    document.addEventListener('mouseup', graphPanEnd);
    document.addEventListener('touchmove', graphPanMove, { passive: false });
    document.addEventListener('touchend', graphPanEnd);
}
function graphPanMove(e) {
    if (!_panState) return;
    if (e.cancelable) e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    const dx = (t.clientX - _panState.startX) / _panState.rect.width  * (_panState.xMax - _panState.xMin);
    const dy = (t.clientY - _panState.startY) / _panState.rect.height * (_panState.yMax - _panState.yMin);
    State.set({
        graphXMin: _panState.xMin - dx, graphXMax: _panState.xMax - dx,
        graphYMin: _panState.yMin + dy, graphYMax: _panState.yMax + dy
    });
    // Update the SVG only, not full page (don't refocus inputs)
    const wrap = $('#graph-wrap');
    if (wrap) {
        const overlay = wrap.querySelector('.graph-overlay');
        wrap.innerHTML = renderGraphSVG(
            State.get('graphFn'),
            State.get('graphXMin'), State.get('graphXMax'),
            State.get('graphYMin'), State.get('graphYMax')
        );
        if (overlay) wrap.appendChild(overlay);
    }
}
function graphPanEnd() {
    if (_panState) $('#graph-wrap')?.classList.remove('panning');
    _panState = null;
    document.removeEventListener('mousemove', graphPanMove);
    document.removeEventListener('mouseup', graphPanEnd);
    document.removeEventListener('touchmove', graphPanMove);
    document.removeEventListener('touchend', graphPanEnd);
    renderGraphPage();
}

const CURRENCY_RATES_DATE = '2026-04-29';
// All rates are: 1 GBP = X (target currency).
// Sourced from Yahoo Finance, eToro, Wise and HDFC treasury rates, late April 2026.
const CURRENCY_RATES = {
    GBP: { label: 'British Pound',     rate: 1.0,    symbol: '£' },
    USD: { label: 'US Dollar',         rate: 1.35,   symbol: '$' },

    INR: { label: 'Indian Rupee',      rate: 125.78, symbol: '₹' },
    SGD: { label: 'Singapore Dollar',  rate: 1.72,   symbol: 'S$' },
    HKD: { label: 'Hong Kong Dollar',  rate: 10.59,  symbol: 'HK$' },

    ZAR: { label: 'South African Rand',rate: 24.60,  symbol: 'R' },

    BRL: { label: 'Brazilian Real',    rate: 7.00,   symbol: 'R$' },
    AED: { label: 'UAE Dirham',        rate: 4.97,   symbol: 'د.إ' },
    PLN: { label: 'Polish Złoty',      rate: 4.92,   symbol: 'zł' },
    RON: { label: 'Romanian Leu',      rate: 5.88,   symbol: 'lei' }
};

function convertCurrency(amount, from, to) {
    const rates = getActiveRates();
    const fromRate = rates[from]?.rate;
    const toRate = rates[to]?.rate;
    if (!fromRate || !toRate) return null;
    // Convert from → GBP → to
    const gbp = amount / fromRate;
    return gbp * toRate;
}

// Pick the best rate source: live > cache > static.
// Returns the rates object that everything else uses.
function getActiveRates() {
    const live = State.get('liveRates');
    if (live && live.rates) return live.rates;
    const cached = Store.get('cachedRates');
    if (cached && cached.rates) return cached.rates;
    return CURRENCY_RATES;
}

// Information about which source we're using, for the UI banner.
// lastUpdate / nextUpdate are unix-seconds timestamps from the API when available.
function getRateSource() {
    const live = State.get('liveRates');
    if (live && live.rates) {
        return {
            source: 'live',
            date: live.date,
            ageDays: 0,
            lastUpdate: live.lastUpdate,
            nextUpdate: live.nextUpdate
        };
    }
    const cached = Store.get('cachedRates');
    if (cached && cached.date) {
        const ageDays = Math.floor((Date.now() - cached.ts) / 86400000);
        return {
            source: 'cache',
            date: cached.date,
            ageDays,
            lastUpdate: cached.lastUpdate,
            nextUpdate: cached.nextUpdate
        };
    }
    const staticDate = new Date(CURRENCY_RATES_DATE);
    const ageDays = Math.floor((Date.now() - staticDate.getTime()) / 86400000);
    return { source: 'static', date: CURRENCY_RATES_DATE, ageDays, lastUpdate: null, nextUpdate: null };
}

// Format a unix-seconds timestamp as a local date + time string.
// For a UK user this renders the API's 00:00 UTC update as 01:00 (BST).
function formatUpdateTime(unixSeconds) {
    if (!unixSeconds) return null;
    const d = new Date(unixSeconds * 1000);
    try {
        return d.toLocaleString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    } catch {
        return d.toISOString().slice(0, 16).replace('T', ' ');
    }
}

// Decide whether the cached rates are still current. The API refreshes once
// every 24h; if we're before the cached next-update time, no fetch is needed.
function cachedRatesAreFresh() {
    const cached = Store.get('cachedRates');
    if (!cached || !cached.rates || !cached.nextUpdate) return false;
    const nowSec = Math.floor(Date.now() / 1000);
    return nowSec < cached.nextUpdate;
}

// Fetch live rates from a free API (open.er-api.com — no key, CORS-allowed).
// The endpoint updates once every 24h at 00:00 UTC and returns the exact
// last/next update timestamps, which we store and display.
// Stores the result in state and localStorage. Falls back silently on error.
// Pass force=true to bypass the freshness check (manual refresh button).
async function fetchLiveRates(force = false) {
    if (State.get('rateFetchInFlight')) return;

    // If a manual refresh wasn't requested and our cache is still within the
    // API's daily window, adopt the cache into state and skip the network call.
    if (!force && cachedRatesAreFresh()) {
        const cached = Store.get('cachedRates');
        State.set({ liveRates: {
            rates: cached.rates,
            date: cached.date,
            lastUpdate: cached.lastUpdate,
            nextUpdate: cached.nextUpdate
        }});
        if (Router.getCurrent() === '/currency') renderCurrencyPage();
        scheduleNextRateFetch(cached.nextUpdate);
        return;
    }

    State.set({ rateFetchInFlight: true });
    try {
        const response = await fetch('https://open.er-api.com/v6/latest/GBP', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!data || data.result !== 'success' || !data.rates) throw new Error('Bad response');
        // Build a rates table in our format. Keep labels/symbols from the static table.
        const built = {};
        for (const code of Object.keys(CURRENCY_RATES)) {
            const apiRate = data.rates[code];
            if (apiRate !== undefined) {
                built[code] = { ...CURRENCY_RATES[code], rate: apiRate };
            } else {
                // Currency not in API response — keep static rate as fallback
                built[code] = { ...CURRENCY_RATES[code] };
            }
        }
        const lastUpdate = data.time_last_update_unix || Math.floor(Date.now() / 1000);
        const nextUpdate = data.time_next_update_unix || (lastUpdate + 86400);
        const date = new Date(lastUpdate * 1000).toISOString().slice(0, 10);
        const payload = { rates: built, date, lastUpdate, nextUpdate };
        State.set({ liveRates: payload, rateFetchInFlight: false, rateFetchError: null });
        Store.set('cachedRates', { ...payload, ts: Date.now() });
        // If currency page is visible, refresh it to show new rates
        if (Router.getCurrent() === '/currency') renderCurrencyPage();
        scheduleNextRateFetch(nextUpdate);
    } catch (err) {
        State.set({ rateFetchInFlight: false, rateFetchError: err.message });
    }
}

// Schedule an automatic refetch shortly after the API's next update time,
// so a long-running tab picks up the new daily rates without a manual refresh.
let _rateFetchTimer = null;
function scheduleNextRateFetch(nextUpdateUnix) {
    if (!nextUpdateUnix) return;
    if (_rateFetchTimer) clearTimeout(_rateFetchTimer);
    // Fire 60s after the published next-update time to allow the API to publish.
    const delayMs = (nextUpdateUnix * 1000 + 60000) - Date.now();
    // Guard against absurd values; cap at the max 32-bit setTimeout range.
    if (delayMs <= 0 || delayMs > 2147483647) return;
    _rateFetchTimer = setTimeout(() => fetchLiveRates(true), delayMs);
}

// Sidebar Escape handler — runs before the calc handler. If sidebar is open,
// Escape closes it instead of doing anything else.

    if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) {
        e.preventDefault();
        e.stopPropagation();
        closeSidebar();
    }
}, true);   // capture phase so this runs first

document.addEventListener('keydown', (e) => {
    // Skip if typing in an input that isn't the calculator
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

    // Only act on the calc page
    if (Router.getCurrent() !== '/calc') return;

    // Ignore shortcuts so we don't swallow browser ones (Ctrl+C, Cmd+R etc.)
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const key = e.key;

    // Digits
    if (/^[0-9]$/.test(key)) { e.preventDefault(); appendToExpression(key); return; }
    // Operators
    if (key === '+' || key === '-') { e.preventDefault(); appendToExpression(key); return; }
    if (key === '*') { e.preventDefault(); appendToExpression('×'); return; }
    if (key === '/') { e.preventDefault(); appendToExpression('÷'); return; }
    if (key === '^') { e.preventDefault(); appendToExpression('^'); return; }
    if (key === '(' || key === ')') { e.preventDefault(); appendToExpression(key); return; }
    if (key === '.' || key === ',') { e.preventDefault(); appendToExpression('.'); return; }
    // Equals
    if (key === '=' || key === 'Enter') { e.preventDefault(); commitResult(); return; }
    // Delete
    if (key === 'Backspace') { e.preventDefault(); handleAction('del'); return; }
    if (key === 'Escape' || key === 'Delete') { e.preventDefault(); handleAction('clear'); return; }
    // Constants
    if (key === 'p') { e.preventDefault(); appendToExpression('π'); return; }
});

/* ============================================
   KEY WEAR — seeded grime so every key wears
   differently but the same way on every reload.
   CSS reads the --g* properties on each key.
   ============================================ */
const WORN_KEYS = '.key, .tool-btn, .unit-swap, .share-btn, .history-note-btn';

function wearKey(el) {
    const parent = el.parentNode;
    const seed = (el.textContent || '').trim() + '|' + el.className + '|' +
        (parent ? Array.prototype.indexOf.call(parent.children, el) : 0);
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
    const rnd = () => {
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return ((h ^= h >>> 16) >>> 0) / 4294967296;
    };
    const pct = (lo, hi) => (lo + rnd() * (hi - lo)).toFixed(0) + '%';
    // The keys pressed most (digits, =, AC/DEL) carry the most muck
    const busy = /\b(num|equals|danger)\b/.test(el.className) ? 1.5 : 1;
    el.style.setProperty('--gx', pct(10, 90));
    el.style.setProperty('--gy', pct(45, 95));
    el.style.setProperty('--gw', pct(25, 60));
    el.style.setProperty('--gh', pct(20, 45));
    el.style.setProperty('--ga', ((0.07 + rnd() * 0.09) * busy).toFixed(3));
    el.style.setProperty('--gx2', pct(10, 90));
    el.style.setProperty('--gy2', pct(10, 60));
    el.style.setProperty('--gw2', pct(15, 35));
    el.style.setProperty('--gh2', pct(12, 30));
    el.style.setProperty('--ga2', ((0.04 + rnd() * 0.07) * busy).toFixed(3));
    // Grime that collects in the bottom corner where the cap meets the skirt
    el.style.setProperty('--gc', rnd() < 0.5 ? '12%' : '88%');
    el.style.setProperty('--gca', (0.05 + rnd() * 0.08).toFixed(3));
    // About one key in eight has yellowed with age
    el.style.setProperty('--age', rnd() < 0.125 ? (0.08 + rnd() * 0.08).toFixed(3) : '0');
    el.dataset.worn = '1';
}

let _wearQueued = false;
function wearKeys() {
    _wearQueued = false;
    document.querySelectorAll(WORN_KEYS).forEach(el => { if (!el.dataset.worn) wearKey(el); });
}
new MutationObserver(() => {
    if (_wearQueued) return;
    _wearQueued = true;
    requestAnimationFrame(wearKeys);
}).observe(document.body, { childList: true, subtree: true });

// Inline onclick handlers need these on window, so the app still works if

<script>
(() => {
    const SITE_URL  = 'https://calculator.batchbinary.app';
    const SITE_TEXT = "BatchCalc — every calculator you'll ever need. Free in your browser, no sign-up.";
    const u = encodeURIComponent(SITE_URL);
    const t = encodeURIComponent(SITE_TEXT);
    const setHref = (id, href) => { const el = document.getElementById(id); if (el) el.href = href; };
    setHref('share-x',      `https://twitter.com/intent/tweet?text=${t}&url=${u}`);
    setHref('share-wa',     `https://wa.me/?text=${t}%20${u}`);
    setHref('share-reddit', `https://www.reddit.com/submit?url=${u}&title=${t}`);
    setHref('share-fb',     `https://www.facebook.com/sharer/sharer.php?u=${u}`);
    const copy = document.getElementById('share-copy');
    if (copy) copy.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(SITE_URL);
            copy.style.color = 'var(--success)';
            setTimeout(() => copy.style.color = '', 1800);
        } catch {
            copy.style.color = 'var(--danger)';
            setTimeout(() => copy.style.color = '', 1800);
        }
    });
})();
</script>
